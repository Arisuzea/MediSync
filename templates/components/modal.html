{% load ui %}{% comment %}
Use through the tag, not include:  {% modal id="x" icon="logout" title="..." tone="navy" %}body{% endmodal %}
  tone -> navy (default) | warn | bad
{% endcomment %}<div class="ov" id="modal-{{ id }}" data-modal hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-{{ id }}-title">
    <div class="eic modal__icon modal__icon--{{ tone|default:'navy' }}">{% icon icon|default:"info" 26 %}</div>
    <h3 id="modal-{{ id }}-title" style="font-size:19px">{{ title }}</h3>
    {{ body }}
  </div>
</div>
