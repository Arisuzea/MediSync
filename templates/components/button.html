{% load ui %}{% comment %}
Usage: {% include "components/button.html" with label="Save" variant="gold" icon="check" %}
  href     -> renders an <a>; otherwise a <button type="button"> (or type="submit" via type=)
  variant  -> primary (default) | gold | outline | ghost | danger
  size     -> sm | md | lg (optional)
  block    -> True for full width
  icon     -> name from apps/core/icons.py
  disabled -> True to disable
  soon     -> True for a feature that is not built yet: looks normal, does nothing, tooltip explains
{% endcomment %}{% if href %}<a href="{{ href }}" class="btn btn--{{ variant|default:'primary' }}{% if size %} btn--{{ size }}{% endif %}{% if block is True %} btn--block{% endif %}">{% else %}<button type="{{ type|default:'button' }}" class="btn btn--{{ variant|default:'primary' }}{% if size %} btn--{{ size }}{% endif %}{% if block is True %} btn--block{% endif %}{% if soon %} is-soon{% endif %}"{% if disabled %} disabled aria-disabled="true"{% endif %}{% if soon %} aria-disabled="true" title="Coming in a later stage"{% endif %}>{% endif %}{% if icon %}{% if size == "sm" %}{% icon icon 14 %}{% elif size == "lg" %}{% icon icon 18 %}{% else %}{% icon icon 16 %}{% endif %}{% endif %}{% if label %}<span>{{ label }}</span>{% endif %}{% if href %}</a>{% else %}</button>{% endif %}
