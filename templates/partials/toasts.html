{% load ui %}
<div class="troot" id="troot" role="status" aria-live="polite">
  {% for message in messages %}
    <div class="toast {{ message.tags }}">
      <span class="iw">{% if message.tags == "success" %}{% icon "checkc" 17 %}{% elif message.tags == "error" %}{% icon "alert" 17 %}{% else %}{% icon "info" 17 %}{% endif %}</span>
      <div><strong>{{ message }}</strong></div>
    </div>
  {% endfor %}
</div>
