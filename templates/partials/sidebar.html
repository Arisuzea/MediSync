{% load ui %}
<aside class="sidebar" id="sidebar" aria-label="Main navigation">
  <div class="sb-top">
    <div class="brand">
      <span class="bmark" aria-hidden="true">M</span>
      <div>
        <div class="bname">MediSync</div>
        <div class="bsub">NU DASMARIÑAS</div>
      </div>
    </div>
    <div class="sb-line"></div>
  </div>

  <nav aria-label="Main">
    {% for item in main_nav %}
      {% if item.href %}
        <a class="nav{% if item.active %} on{% endif %}" href="{{ item.href }}"{% if item.active %} aria-current="page"{% endif %}>
      {% else %}
        <span class="nav is-soon" aria-disabled="true" title="Coming in a later stage">
      {% endif %}
        {% icon item.icon 18 %}<span class="nav__label">{{ item.label }}</span>
        {% if item.badge == "unread" and unread_count %}<span class="nav__count">{{ unread_count }}</span>{% endif %}
      {% if item.href %}</a>{% else %}</span>{% endif %}
    {% endfor %}
  </nav>

  <div class="sb-bottom">
    <div class="sb-line"></div>
    <button type="button" class="nav nav--out" data-modal-open="signout">
      {% icon "lu-log-out" 18 %}<span class="nav__label">Logout</span>
    </button>
  </div>
</aside>
